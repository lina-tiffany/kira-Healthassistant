databases:
  - name: kira-db
    plan: free
    databaseName: kira
    user: kira

services:
  - type: web
    name: kira-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DATABASE_URL
        fromDatabase:
          name: kira-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://kira-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://kira-frontend.onrender.com

  - type: web
    name: kira-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://kira-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
